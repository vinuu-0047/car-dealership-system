version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: car_dealer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: car_dealer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_dealer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: car_dealer_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/car_dealer_db
      JWT_SECRET: car-dealer-super-secret-key-2024-tdd-kata
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    command: sh -c "npx prisma migrate deploy && npx ts-node prisma/seed.ts && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: car_dealer_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
